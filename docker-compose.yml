services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ai_research
      MYSQL_USER: ai_research
      MYSQL_PASSWORD: ai_research
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3308:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysqldata: